name: Build RootHide DEB
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      THEOS: ${{ github.workspace }}/.theos
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install ldid xz make dpkg
      - name: Set up RootHide Theos
        run: |
          git clone --recursive https://github.com/roothide/theos.git "$THEOS"
          git clone --depth 1 https://github.com/theos/sdks.git "$RUNNER_TEMP/theos-sdks"
          mkdir -p "$THEOS/sdks"
          cp -R "$RUNNER_TEMP/theos-sdks"/*.sdk "$THEOS/sdks/"
          xcodebuild -version
      - name: Build package
        run: |
          gmake clean package THEOS_PACKAGE_SCHEME=roothide FINALPACKAGE=1
          for deb in packages/*.deb; do
            test "$(dpkg-deb -f "$deb" Architecture)" = iphoneos-arm64e
            dpkg-deb -c "$deb"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: AODSeconds-RootHide-DEB
          path: packages/*.deb
          if-no-files-found: error
